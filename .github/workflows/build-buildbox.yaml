name: Build Buildbox

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile.buildbox
      - build.assets/versions.mk
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-buildbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get toolchain versions from versions.mk
        run: |
          echo "GOLANG_VERSION=$(make -s -C build.assets print-go-version | sed 's/^go//')" >> $GITHUB_ENV
          echo "RUST_VERSION=$(make -s -C build.assets print-rust-version)" >> $GITHUB_ENV
          echo "NODE_VERSION=$(make -s -C build.assets print-node-version)" >> $GITHUB_ENV
          echo "WASM_BINDGEN_VERSION=$(make -s -C build.assets print-wasm-bindgen-version)" >> $GITHUB_ENV
          echo "WASM_OPT_VERSION=$(make -s -C build.assets print-wasm-opt-version)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.buildbox
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            RUST_VERSION=${{ env.RUST_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            WASM_BINDGEN_VERSION=${{ env.WASM_BINDGEN_VERSION }}
            WASM_OPT_VERSION=${{ env.WASM_OPT_VERSION }}
          tags: ghcr.io/k3k8/teleport-buildbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
